[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "elonbot"
version = "0.1.0"
description = "Telegram bot for scheduled announcements in groups"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "aiogram>=3.0,<4.0",
    "alembic>=1.13,<2.0",
    "apscheduler>=3.10,<4.0",
    "asyncpg>=0.29,<1.0",
    "fastapi>=0.110,<1.0",
    "pydantic-settings>=2.2,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.5,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/elonbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
