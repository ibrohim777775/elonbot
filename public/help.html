<!doctype html>
<html lang="{{language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Elonbot — {{help}}</title>
  <meta name="description" content="{{title}}">
  <link rel="stylesheet" href="/app-assets/app.css">
  <link rel="stylesheet" href="/app-assets/help.css">
  <script src="https://telegram.org/js/telegram-web-app.js" defer></script>
  <script src="/app-assets/help.js" defer></script>
</head>
<body class="help-page">
  <header class="topbar"><span class="brand"><span class="brand-mark">e</span>elonbot<span class="brand-dot">.</span></span><span class="connection">{{help}}</span></header>
  <nav class="help-languages" aria-label="{{languages}}"><a href="/help?lang=uz" lang="uz" {{uzCurrent}}>O'zbekcha</a><a href="/help?lang=ru" lang="ru" {{ruCurrent}}>Русский</a></nav>
  <main id="guide" class="guide" tabindex="-1">
    <details class="guide-contents"><summary>{{contents}}</summary><nav>{{links}}</nav></details>
    <article>{{article}}</article>
  </main>
  <footer class="guide-footer" hidden><button type="button" class="primary" id="close-guide">{{close}}</button></footer>
</body>
</html>
