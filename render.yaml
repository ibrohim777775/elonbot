services:
  - type: web
    name: elonbot
    runtime: node
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: NODE_VERSION
        value: 24.12.0
      - key: APP_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # Configure exact ingress proxy IPs after confirming the provider's proxy chain.
      - key: TRUSTED_PROXY_IPS
        sync: false
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: SESSION_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: ADMIN_IDS
        sync: false
